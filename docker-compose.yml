version: "3.8"

services:
  app:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      # Монтируем assets как volume: хост:контейнер:режим
      - ./assets:/app/assets:rw
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
#    healthcheck:
#      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
#      interval: 10s
#      timeout: 5s
#      retries: 3
#      start_period: 40s

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d avatarCalendar"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: